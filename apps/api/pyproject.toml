[project]
name = "investingbuddy-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "jsonschema>=4.23",
    "httpx>=0.27",
    # Phase 29B.2: pure-Python PDF text extraction for bounded primary-document
    # (annual report) excerpting. No system deps, no OCR. Lightweight.
    "pypdf>=4.0,<6",
    # Phase 32A Slice 5: table-aware PDF text/layout extraction for bounded
    # primary-document ingestion. Pure-Python; transitively brings pdfminer.six +
    # Pillow (Pillow gates the future OCR raster path via a pixel cap). No system
    # deps, no OCR binary (tesseract/pdf2image/pymupdf intentionally excluded).
    "pdfplumber>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    # Offline async SQLite driver for real-DB tests (e.g. company-scoped
    # from-company selection). Test-only — never used at runtime.
    "aiosqlite>=0.20",
    # Phase 32A Slice 5B.2: the OCR test suite monkeypatches
    # azure.identity.aio.DefaultAzureCredential / azure.core.credentials.
    # AzureKeyCredential, which requires the real package to be importable
    # (a monkeypatch target must exist). CI runs `pip install -e ".[dev]"`, so
    # these must be here, not only in the runtime-only `ocr` extra below.
    "azure-ai-documentintelligence>=1.0,<2",
    "azure-identity>=1.19,<2",
    # Phase 32A corrective (real OCR proof) — required for azure-core's ASYNC
    # transport to actually make a network call; see requirements.txt for the
    # full incident note (this was the true reason a live OCR call was never
    # observed on staging).
    "aiohttp>=3.9,<4",
]
# Install in Azure App Service (staging/production).
# gunicorn serves uvicorn workers for multi-process production serving.
deploy = [
    "gunicorn>=23.0",
]
# Install when LLM_PROVIDER=azure_openai is used locally or in staging.
# Not required for CI — default LLM_PROVIDER=mock uses no Azure credentials.
llm = [
    "langchain-openai>=0.2",
]
# Phase 32A Slice 5B.2: real Azure Document Intelligence OCR adapter, for a
# RUNTIME install that skips the rest of `dev` (e.g. a minimal production-like
# venv). Not needed for CI (see the `dev` extra above, which is what CI
# installs and already includes these two for the test suite).
ocr = [
    "azure-ai-documentintelligence>=1.0,<2",
    "azure-identity>=1.19,<2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Curated reference data table (theme -> real-company registry): long, aligned
# single-line rows are more readable than wrapped ones. Phase 27.
"app/services/market_universe_builder.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: live network tests — run with ENABLE_INTEGRATION_TESTS=true; never runs in CI",
]
